# =====================================================================
# FusionWarp-Stereo 训练配置（完整融合版：全部开关都开）
# =====================================================================
# 开启：corr 锚 + GlobalMatcher 起点 + GatedFusion 门控融合 + TokenSparse 解码器
#
# 关键修正（针对之前 baseline EPE 卡 1 / 后期崩溃）：
#   1. batch 16 → BASE_LR 降半到 0.00025
#   2. GM_NDISP 改成 24（=192//8，修正候选范围与训练视差不匹配）
#   3. 只用 sceneflow，与 baseline 公平对照
#
# ⚠️ 注意：全开同时训练 4 个新模块，若 EPE 异常不好定位是谁的问题。
#    建议的稳妥流程：先跑主方案(corr 锚单独)确认锚有效，再逐步加 ②③④。
# =====================================================================
ALGORITHM: "waft"
WAFT:
  MAX_DISP: 800
  LOSS: ['mixlap_40']
  GRADIENT_LOSS_WEIGHT: 0.5   # 升级3：梯度匹配损失
  FEATURE_ENCODER:
    TYPE: "dav2"
    ARCH: "vits"
    LORA_RANK: 8
    LORA_ALPHA: 16
  ITERATIVE_MODULE:
    TASK: ['delta', 'delta', 'delta']
    DELTA_ITER:
      TYPE: "vit_sparse"    # 开 token 稀疏（原 vit）
      ARCH: "vits"
      PATCH_SIZE: 8
    PROP_ITER:
      TYPE: "vit"
      ARCH: "vits"
      PATCH_SIZE: 8
  FUSION:
    ENABLED: True
    USE_ANCHOR: True          # 开：相关锚（方向1）
    USE_GLOBAL_INIT: True     # 开：GlobalMatcher 替换 bins 分类起点（方向2）
    USE_GATED_FUSION: True    # 开：门控融合「局部锚 + 全局上下文」（需 USE_GLOBAL_INIT=True）
    USE_DPI: True             # 开：DAv2 单目深度 warm start（升级1）
    ANCHOR_KIND: "corr"       # "corr"(无聚合) | "gev"(3D聚合)
    MATCH_CH: 32
    CORR_RADIUS: 4
    CORR_GROUPS: 8
    CORR_MULTI_SCALE: True    # 开：1/4+1/8 多尺度相关锚（升级2）
    GEV_AGG_KIND: "sep3d"
    GEV_K: 9
    GEV_R: 8
    GM_HEADS: 4
    GM_NDISP: 24              # =192//8，匹配训练视差上限(192)
DATASETS:
  TRAIN: ("sceneflow",)
  MUL: (1,)
  CROP_SIZE: [480, 640]
  TEST: ("things",)
TEST:
  EVAL_PERIOD: 10000
  EVAL_THRESH: (['1.0', '3.0'],)
  EVAL_MAX_DISP: [null,]
  EVAL_ONLY_VALID: (True,)
SOLVER:
  MIX_PRECISION: True
  NO_RESUME_OPTIMIZER: True
  IMS_PER_BATCH: 16
  MAX_ITER: 400000
  CHECKPOINT_PERIOD: 10000
  BASE_LR: 0.00025           # batch16 → LR 降半
